name: IWMO BlackRock Holdings Monitor
on:
  schedule:
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holdings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install report and momentum dependencies
        run: pip install requests pandas openpyxl yfinance
      - name: Fetch BlackRock holdings, momentum proxy and Excel history
        run: python monitor_holdings.py
      - name: Commit archived holdings and workbook to Pages
        run: |
          git config user.name "IWMO Monitor Bot"
          git config user.email "iwmo-monitor@noreply.github.com"
          git add holdings
          git diff --staged --quiet || git commit -m "IWMO portfolio archive $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
