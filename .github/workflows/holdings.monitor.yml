name: IWMO BlackRock Holdings Monitor
on:
  schedule:
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holdings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Fetch and compare BlackRock holdings
        run: python monitor_holdings.py
      - name: Commit snapshot and report
        run: |
          git config user.name "IWMO Monitor Bot"
          git config user.email "iwmo-monitor@noreply.github.com"
          git add holdings
          git diff --staged --quiet || git commit -m "IWMO holdings snapshot $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
